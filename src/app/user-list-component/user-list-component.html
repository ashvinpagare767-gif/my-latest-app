

<table class="table table-boarder" *ngIf="userListData.length >0">
    <thead>
    <tr>
        <th scope="col">
            Id 
        </th>
        <th scope="col">
            First Name 
        </th>
        <th scope="col">
            Last Name 
        </th>
        <th scope="col">
            Email 
        </th>
    </tr>
    </thead>
    <tbody>
       
    @for (user of userListData; track user.id) {
    <tr>
        <td>
             {{user.id}}
        </td>
         <td>
             {{user.firstName}}
        </td>
         <td>
             {{user.lastName}}
        </td>
         <td>
             {{user.email}}
        </td>
    </tr>
     }
    
     </tbody>
</table>
