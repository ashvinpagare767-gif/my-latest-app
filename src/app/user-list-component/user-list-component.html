
<table class="table table-boarder">
    <thead>
    <tr>
        <th scope="col">
            Id 
        </th>
        <th scope="col">
            Title 
        </th>
        <th scope="col">
            Completed 
        </th>
    </tr>
    </thead>
    <tbody>
    @for (user of userListData; track user.id) {
    <tr>
        <td>
             {{user.id}}
        </td>
         <td>
             {{user.title}}
        </td>
         <td>
             {{user.completed}}
        </td>
    </tr>
     }
     @empty {
    <tr><td colspan="3" class="text-center">No data available</td></tr>
     }
     </tbody>
</table>
